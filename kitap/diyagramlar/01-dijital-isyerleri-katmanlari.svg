<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" role="img" aria-labelledby="t">
  <title id="t">Dijital işyeri katmanları</title>
  <rect width="100%" height="100%" fill="#0f1419"/>
  <defs>
    <style>
      .t{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#e8eef5}
      .s{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#9db0c5;font-size:12px}
      .h{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#e8eef5;font-size:16px;font-weight:700}
      .box{fill:#1a2330;stroke:#3a4b5f;stroke-width:1.5}
      .acc{fill:#1e3a5f;stroke:#5b9fd4;stroke-width:1.5}
      .ok{fill:#163528;stroke:#3d9b6c;stroke-width:1.5}
      .warn{fill:#3a2e14;stroke:#c9a227;stroke-width:1.5}
      .line{stroke:#5b9fd4;stroke-width:1.5;fill:none}
      .muted{stroke:#3a4b5f;stroke-width:1.2;fill:none}
    </style>
  </defs>
  
  <text class="h" x="24" y="36">Dijital işyeri katmanları</text>
  <rect class="warn" x="60" y="70" width="700" height="50" rx="6"/><text class="t" x="80" y="100">Deneyim: Outlook · Teams · Office · Mobil</text>
  <rect class="ok" x="60" y="130" width="700" height="50" rx="6"/><text class="t" x="80" y="160">İş yükleri: Exchange · SharePoint/OneDrive · Teams</text>
  <rect class="acc" x="60" y="190" width="700" height="50" rx="6"/><text class="t" x="80" y="220">Kimlik &amp; güvenlik: Entra ID · CA · Defender · Purview</text>
  <rect class="box" x="60" y="250" width="700" height="50" rx="6"/><text class="t" x="80" y="280">Operasyon: Admin centers · PowerShell · Graph · Runbook</text>

</svg>
