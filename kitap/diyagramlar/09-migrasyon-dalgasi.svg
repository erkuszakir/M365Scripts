<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-labelledby="t">
  <title id="t">Migrasyon dalgaları</title>
  <rect width="100%" height="100%" fill="#0f1419"/>
  <defs>
    <style>
      .t{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#e8eef5}
      .s{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#9db0c5;font-size:12px}
      .h{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#e8eef5;font-size:16px;font-weight:700}
      .box{fill:#1a2330;stroke:#3a4b5f;stroke-width:1.5}
      .acc{fill:#1e3a5f;stroke:#5b9fd4;stroke-width:1.5}
      .ok{fill:#163528;stroke:#3d9b6c;stroke-width:1.5}
      .warn{fill:#3a2e14;stroke:#c9a227;stroke-width:1.5}
      .line{stroke:#5b9fd4;stroke-width:1.5;fill:none}
      .muted{stroke:#3a4b5f;stroke-width:1.2;fill:none}
    </style>
  </defs>
  
  <text class="h" x="24" y="36">Migrasyon dalga modeli</text>
  <rect class="box" x="40" y="90" width="180" height="90" rx="8"/><text class="t" x="95" y="130">Pilot</text><text class="s" x="70" y="155">IT + gönüllü</text>
  <rect class="acc" x="250" y="90" width="180" height="90" rx="8"/><text class="t" x="275" y="130">Early adopter</text><text class="s" x="275" y="155">bir iş birimi</text>
  <rect class="ok" x="460" y="90" width="180" height="90" rx="8"/><text class="t" x="510" y="130">Genel yayılım</text><text class="s" x="490" y="155">dalgalar halinde</text>
  <rect class="warn" x="670" y="90" width="180" height="90" rx="8"/><text class="t" x="715" y="130">Optimizasyon</text><text class="s" x="695" y="155">temizlik · hibrit off</text>
  <path class="line" d="M220 135 H250 M430 135 H460 M640 135 H670"/>
  <text class="s" x="40" y="230">Her dalganın başarı ölçütü ve geri alma planı olsun. Big bang Cuma geceleri efsanedir, iyi plan değildir.</text>

</svg>
