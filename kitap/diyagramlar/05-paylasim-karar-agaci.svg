<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="t">
  <title id="t">Paylaşım karar ağacı</title>
  <rect width="100%" height="100%" fill="#0f1419"/>
  <defs>
    <style>
      .t{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#e8eef5}
      .s{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#9db0c5;font-size:12px}
      .h{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#e8eef5;font-size:16px;font-weight:700}
      .box{fill:#1a2330;stroke:#3a4b5f;stroke-width:1.5}
      .acc{fill:#1e3a5f;stroke:#5b9fd4;stroke-width:1.5}
      .ok{fill:#163528;stroke:#3d9b6c;stroke-width:1.5}
      .warn{fill:#3a2e14;stroke:#c9a227;stroke-width:1.5}
      .line{stroke:#5b9fd4;stroke-width:1.5;fill:none}
      .muted{stroke:#3a4b5f;stroke-width:1.2;fill:none}
    </style>
  </defs>
  
  <text class="h" x="24" y="36">Dış paylaşım karar ağacı</text>
  <rect class="acc" x="340" y="60" width="220" height="50" rx="8"/><text class="t" x="375" y="92">Dışarı paylaşılacak mı?</text>
  <rect class="ok" x="80" y="160" width="200" height="50" rx="8"/><text class="t" x="130" y="192">Hayır → Org only</text>
  <rect class="warn" x="620" y="160" width="220" height="50" rx="8"/><text class="t" x="660" y="192">Evet → kimlerle?</text>
  <rect class="box" x="520" y="250" width="160" height="50" rx="8"/><text class="t" x="545" y="282">Existing guests</text>
  <rect class="box" x="700" y="250" width="160" height="50" rx="8"/><text class="t" x="735" y="282">New guests</text>
  <rect class="box" x="610" y="320" width="180" height="40" rx="8"/><text class="s" x="640" y="345">Anyone = istisna + TTL</text>
  <path class="line" d="M340 85 H280 V185 H280 M560 85 H730 V185"/>

</svg>
