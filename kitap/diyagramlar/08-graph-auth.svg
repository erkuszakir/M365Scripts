<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320" role="img" aria-labelledby="t">
  <title id="t">Graph auth</title>
  <rect width="100%" height="100%" fill="#0f1419"/>
  <defs>
    <style>
      .t{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#e8eef5}
      .s{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#9db0c5;font-size:12px}
      .h{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#e8eef5;font-size:16px;font-weight:700}
      .box{fill:#1a2330;stroke:#3a4b5f;stroke-width:1.5}
      .acc{fill:#1e3a5f;stroke:#5b9fd4;stroke-width:1.5}
      .ok{fill:#163528;stroke:#3d9b6c;stroke-width:1.5}
      .warn{fill:#3a2e14;stroke:#c9a227;stroke-width:1.5}
      .line{stroke:#5b9fd4;stroke-width:1.5;fill:none}
      .muted{stroke:#3a4b5f;stroke-width:1.2;fill:none}
    </style>
  </defs>
  
  <text class="h" x="24" y="36">Microsoft Graph kimlik modelleri</text>
  <rect class="acc" x="60" y="80" width="320" height="160" rx="10"/>
  <text class="t" x="140" y="120" font-size="15">Delegated</text>
  <text class="s" x="90" y="155">Kullanıcı oturumu ile</text>
  <text class="s" x="90" y="180">İnteraktif araçlar / admin</text>
  <text class="s" x="90" y="205">Scope: User.Read.All …</text>
  <rect class="ok" x="460" y="80" width="320" height="160" rx="10"/>
  <text class="t" x="545" y="120" font-size="15">Application</text>
  <text class="s" x="490" y="155">App registration + consent</text>
  <text class="s" x="490" y="180">Daemon / zamanlanmış iş</text>
  <text class="s" x="490" y="205">Sertifika tercih edilir</text>

</svg>
