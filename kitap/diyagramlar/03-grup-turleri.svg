<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="t">
  <title id="t">Grup türleri</title>
  <rect width="100%" height="100%" fill="#0f1419"/>
  <defs>
    <style>
      .t{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#e8eef5}
      .s{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#9db0c5;font-size:12px}
      .h{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#e8eef5;font-size:16px;font-weight:700}
      .box{fill:#1a2330;stroke:#3a4b5f;stroke-width:1.5}
      .acc{fill:#1e3a5f;stroke:#5b9fd4;stroke-width:1.5}
      .ok{fill:#163528;stroke:#3d9b6c;stroke-width:1.5}
      .warn{fill:#3a2e14;stroke:#c9a227;stroke-width:1.5}
      .line{stroke:#5b9fd4;stroke-width:1.5;fill:none}
      .muted{stroke:#3a4b5f;stroke-width:1.2;fill:none}
    </style>
  </defs>
  
  <text class="h" x="24" y="36">Grup türü seçim matrisi</text>
  <rect class="box" x="24" y="70" width="200" height="120" rx="8"/><text class="t" x="50" y="105">Security Group</text><text class="s" x="40" y="135">Erişim · lisans · CA</text><text class="s" x="40" y="155">Mail yok (genelde)</text>
  <rect class="acc" x="240" y="70" width="200" height="120" rx="8"/><text class="t" x="260" y="105">M365 Group</text><text class="s" x="255" y="135">İşbirliği nesnesi</text><text class="s" x="255" y="155">Mail + Site + Teams</text>
  <rect class="box" x="456" y="70" width="200" height="120" rx="8"/><text class="t" x="480" y="105">Distribution</text><text class="s" x="475" y="135">Sadece mail dağıtımı</text><text class="s" x="475" y="155">ACL için değil</text>
  <rect class="warn" x="672" y="70" width="200" height="120" rx="8"/><text class="t" x="700" y="105">Dinamik Grup</text><text class="s" x="690" y="135">Kurala göre üyelik</text><text class="s" x="690" y="155">Veri kalitesi şart</text>
  <text class="s" x="24" y="240">Karar sorusu: “Erişim mi, işbirliği mi, sadece duyuru mu, yoksa attribute’a göre otomatik mi?”</text>
  <rect class="ok" x="24" y="270" width="848" height="44" rx="6"/><text class="t" x="40" y="298" font-size="13">Yanlış tür seçmek = yanlış Teams, yanlış DLP kapsamı, yanlış lisans ataması</text>

</svg>
