<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="t">
  <title id="t">Zero Trust katmanları</title>
  <rect width="100%" height="100%" fill="#0f1419"/>
  <defs>
    <style>
      .t{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#e8eef5}
      .s{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#9db0c5;font-size:12px}
      .h{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#e8eef5;font-size:16px;font-weight:700}
      .box{fill:#1a2330;stroke:#3a4b5f;stroke-width:1.5}
      .acc{fill:#1e3a5f;stroke:#5b9fd4;stroke-width:1.5}
      .ok{fill:#163528;stroke:#3d9b6c;stroke-width:1.5}
      .warn{fill:#3a2e14;stroke:#c9a227;stroke-width:1.5}
      .line{stroke:#5b9fd4;stroke-width:1.5;fill:none}
      .muted{stroke:#3a4b5f;stroke-width:1.2;fill:none}
    </style>
  </defs>
  
  <text class="h" x="24" y="36">Zero Trust katmanları (M365 bağlamı)</text>
  <rect class="acc" x="70" y="70" width="740" height="48" rx="6"/><text class="t" x="90" y="100">1 · Kimlik — Entra · MFA · Conditional Access · PIM</text>
  <rect class="box" x="70" y="128" width="740" height="48" rx="6"/><text class="t" x="90" y="158">2 · Cihaz — Intune uyumu · App Protection</text>
  <rect class="ok" x="70" y="186" width="740" height="48" rx="6"/><text class="t" x="90" y="216">3 · Uygulama — oturum kontrolleri · app governance</text>
  <rect class="warn" x="70" y="244" width="740" height="48" rx="6"/><text class="t" x="90" y="274">4 · Veri — sensitivity label · DLP · retention</text>
  <rect class="box" x="70" y="302" width="740" height="48" rx="6"/><text class="t" x="90" y="332">5 · Tehdit — Defender for O365 · XDR sinyalleri · audit</text>

</svg>
