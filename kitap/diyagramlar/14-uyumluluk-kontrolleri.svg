<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="t">
  <title id="t">Uyumluluk kontrolleri</title>
  <rect width="100%" height="100%" fill="#0f1419"/>
  <defs><style>
  .t{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#e8eef5}
  .s{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#9db0c5;font-size:12px}
  .h{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#e8eef5;font-size:16px;font-weight:700}
  .box{fill:#1a2330;stroke:#3a4b5f;stroke-width:1.5}
  .acc{fill:#1e3a5f;stroke:#5b9fd4;stroke-width:1.5}
  .ok{fill:#163528;stroke:#3d9b6c;stroke-width:1.5}
  .warn{fill:#3a2e14;stroke:#c9a227;stroke-width:1.5}
  .line{stroke:#5b9fd4;stroke-width:1.5;fill:none}
  </style></defs>
  
  <text class="h" x="24" y="36">Uyumluluk — teknik kontrol haritası</text>
  <rect class="box" x="30" y="80" width="150" height="70" rx="8"/><text class="t" x="55" y="120">Envanter</text>
  <rect class="acc" x="210" y="80" width="150" height="70" rx="8"/><text class="t" x="245" y="120">Etiketle</text>
  <rect class="ok" x="390" y="80" width="150" height="70" rx="8"/><text class="t" x="430" y="120">DLP</text>
  <rect class="warn" x="570" y="80" width="150" height="70" rx="8"/><text class="t" x="600" y="120">Retention</text>
  <rect class="box" x="750" y="80" width="120" height="70" rx="8"/><text class="t" x="775" y="120">eDiscovery</text>
  <path class="line" d="M180 115 H210 M360 115 H390 M540 115 H570 M720 115 H750"/>
  <text class="s" x="30" y="210">KVKK/GDPR talepleri hold ile çatışabilir — hukuk + teknik birlikte.</text>
  <text class="s" x="30" y="240">Geo cevabı: workload + yedek + ISV.</text>

</svg>