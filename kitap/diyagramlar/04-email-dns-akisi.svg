<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="t">
  <title id="t">Email DNS akışı</title>
  <rect width="100%" height="100%" fill="#0f1419"/>
  <defs>
    <style>
      .t{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#e8eef5}
      .s{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#9db0c5;font-size:12px}
      .h{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#e8eef5;font-size:16px;font-weight:700}
      .box{fill:#1a2330;stroke:#3a4b5f;stroke-width:1.5}
      .acc{fill:#1e3a5f;stroke:#5b9fd4;stroke-width:1.5}
      .ok{fill:#163528;stroke:#3d9b6c;stroke-width:1.5}
      .warn{fill:#3a2e14;stroke:#c9a227;stroke-width:1.5}
      .line{stroke:#5b9fd4;stroke-width:1.5;fill:none}
      .muted{stroke:#3a4b5f;stroke-width:1.2;fill:none}
    </style>
  </defs>
  
  <text class="h" x="24" y="36">E-posta DNS omurgası</text>
  <rect class="box" x="30" y="90" width="140" height="80" rx="8"/><text class="t" x="75" y="135">İnternet</text>
  <rect class="acc" x="220" y="90" width="140" height="80" rx="8"/><text class="t" x="270" y="125">MX</text><text class="s" x="240" y="148">nereye gelsin</text>
  <rect class="ok" x="410" y="90" width="140" height="80" rx="8"/><text class="t" x="450" y="125">SPF</text><text class="s" x="430" y="148">kim gönderebilir</text>
  <rect class="warn" x="600" y="90" width="140" height="80" rx="8"/><text class="t" x="640" y="125">DKIM</text><text class="s" x="620" y="148">imza doğrula</text>
  <rect class="box" x="790" y="90" width="90" height="80" rx="8"/><text class="t" x="805" y="135">DMARC</text>
  <path class="line" d="M170 130 H220 M360 130 H410 M550 130 H600 M740 130 H790"/>
  <text class="s" x="30" y="230">Autodiscover CNAME istemci kurulumunu kolaylaştırır. Üçüncü parti gönderenleri SPF’e eklemeyi unutmayın.</text>
  <text class="s" x="30" y="260">Olgun hedef: DMARC p=reject + hizalı DKIM/SPF.</text>

</svg>
