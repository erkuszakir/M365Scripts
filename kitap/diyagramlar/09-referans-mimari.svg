    </style>
  </defs>
  
  <text class="h" x="24" y="36">KuzeyLojistik referans mimari (özet)</text>
  <rect class="acc" x="40" y="70" width="840" height="44" rx="6"/><text class="t" x="60" y="98">Kimlik: Entra · CA tabanı · break-glass · (PIM)</text>
  <rect class="box" x="40" y="125" width="840" height="44" rx="6"/><text class="t" x="60" y="153">Endpoint: Intune ofis · App Protection saha</text>
  <rect class="ok" x="40" y="180" width="840" height="44" rx="6"/><text class="t" x="60" y="208">İş yükleri: EXO · SPO hub · Teams naming/expiration</text>
  <rect class="warn" x="40" y="235" width="840" height="44" rx="6"/><text class="t" x="60" y="263">Güvenlik: Defender O365 · DMARC · anti-phish</text>
  <rect class="box" x="40" y="290" width="840" height="44" rx="6"/><text class="t" x="60" y="318">Veri: Labels · DLP staging→enforce · retention</text>
  <rect class="acc" x="40" y="345" width="840" height="44" rx="6"/><text class="t" x="60" y="373">Operasyon: Graph otomasyon · on/offboarding runbook · audit</text>

