  </style></defs>
  
  <text class="h" x="24" y="36">Power Platform risk yüzeyi</text>
  <rect class="acc" x="40" y="80" width="200" height="100" rx="8"/><text class="t" x="80" y="125">Maker / Citizen</text><text class="s" x="70" y="150">hızlı çözüm üretir</text>
  <rect class="box" x="280" y="80" width="200" height="100" rx="8"/><text class="t" x="320" y="125">Connectors</text><text class="s" x="300" y="150">SPO · Mail · HTTP</text>
