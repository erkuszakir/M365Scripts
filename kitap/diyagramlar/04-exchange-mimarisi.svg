<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-labelledby="t">
  <title id="t">Exchange mimarisi</title>
  <rect width="100%" height="100%" fill="#0f1419"/>
  <defs>
    <style>
      .t{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#e8eef5}
      .s{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#9db0c5;font-size:12px}
      .h{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#e8eef5;font-size:16px;font-weight:700}
      .box{fill:#1a2330;stroke:#3a4b5f;stroke-width:1.5}
      .acc{fill:#1e3a5f;stroke:#5b9fd4;stroke-width:1.5}
      .ok{fill:#163528;stroke:#3d9b6c;stroke-width:1.5}
      .warn{fill:#3a2e14;stroke:#c9a227;stroke-width:1.5}
      .line{stroke:#5b9fd4;stroke-width:1.5;fill:none}
      .muted{stroke:#3a4b5f;stroke-width:1.2;fill:none}
    </style>
  </defs>
  
  <text class="h" x="24" y="36">Exchange Online — basitleştirilmiş mimari</text>
  <rect class="box" x="40" y="90" width="160" height="70" rx="8"/><text class="t" x="75" y="130">Outlook / Client</text>
  <rect class="acc" x="280" y="90" width="180" height="70" rx="8"/><text class="t" x="310" y="120">Transport / EOP</text><text class="s" x="310" y="142">spam · malware</text>
  <rect class="ok" x="540" y="90" width="180" height="70" rx="8"/><text class="t" x="575" y="130">Mailbox DB</text>
  <rect class="box" x="280" y="220" width="180" height="70" rx="8"/><text class="t" x="320" y="250">Mail Flow Rules</text><text class="s" x="320" y="270">connectors</text>
  <rect class="warn" x="540" y="220" width="180" height="70" rx="8"/><text class="t" x="575" y="250">Archive / Hold</text><text class="s" x="560" y="270">retention köprüsü</text>
  <path class="line" d="M200 125 H280 M460 125 H540 M370 160 V220 M630 160 V220"/>

</svg>
