<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-labelledby="t">
  <title id="t">IaaS PaaS SaaS</title>
  <rect width="100%" height="100%" fill="#0f1419"/>
  <defs>
    <style>
      .t{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#e8eef5}
      .s{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#9db0c5;font-size:12px}
      .h{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#e8eef5;font-size:16px;font-weight:700}
      .box{fill:#1a2330;stroke:#3a4b5f;stroke-width:1.5}
      .acc{fill:#1e3a5f;stroke:#5b9fd4;stroke-width:1.5}
      .ok{fill:#163528;stroke:#3d9b6c;stroke-width:1.5}
      .warn{fill:#3a2e14;stroke:#c9a227;stroke-width:1.5}
      .line{stroke:#5b9fd4;stroke-width:1.5;fill:none}
      .muted{stroke:#3a4b5f;stroke-width:1.2;fill:none}
    </style>
  </defs>
  
  <text class="h" x="24" y="36">IaaS / PaaS / SaaS — sorumluluk sınırları</text>
  <text class="s" x="24" y="58">Koyu = sizin yönetim alanınız · Açık çerçeve = sağlayıcı</text>
  <g transform="translate(24,80)">
    <text class="t" x="40" y="0" font-size="13">IaaS</text>
    <rect class="acc" x="0" y="16" width="240" height="36" rx="4"/><text class="t" x="12" y="40" font-size="12">Uygulama + Veri</text>
    <rect class="acc" x="0" y="56" width="240" height="36" rx="4"/><text class="t" x="12" y="80" font-size="12">Runtime / OS</text>
    <rect class="box" x="0" y="96" width="240" height="36" rx="4"/><text class="s" x="12" y="120">Sanallaştırma / Donanım</text>
  </g>
  <g transform="translate(300,80)">
    <text class="t" x="40" y="0" font-size="13">PaaS</text>
    <rect class="acc" x="0" y="16" width="240" height="36" rx="4"/><text class="t" x="12" y="40" font-size="12">Uygulama + Veri</text>
    <rect class="box" x="0" y="56" width="240" height="36" rx="4"/><text class="s" x="12" y="80">Runtime / OS</text>
    <rect class="box" x="0" y="96" width="240" height="36" rx="4"/><text class="s" x="12" y="120">Sanallaştırma / Donanım</text>
  </g>
  <g transform="translate(576,80)">
    <text class="t" x="40" y="0" font-size="13">SaaS (M365)</text>
    <rect class="acc" x="0" y="16" width="240" height="36" rx="4"/><text class="t" x="12" y="40" font-size="12">Veri + Yapılandırma</text>
    <rect class="box" x="0" y="56" width="240" height="36" rx="4"/><text class="s" x="12" y="80">Uygulama / Runtime</text>
    <rect class="box" x="0" y="96" width="240" height="36" rx="4"/><text class="s" x="12" y="120">Altyapı (Microsoft)</text>
  </g>
  <text class="s" x="24" y="280">Önemli: SaaS’ta güvenlik sorumluluğu bitmez — tenant yapılandırması sizdedir.</text>
  <rect class="ok" x="24" y="300" width="812" height="36" rx="6"/>
  <text class="t" x="40" y="323" font-size="13">Microsoft 365 = SaaS + Entra kimliği + sizin politika/otomasyon katmanınız</text>

</svg>
