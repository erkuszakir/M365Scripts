  <text class="h" x="24" y="36">Purview veri yaşam döngüsü</text>
  <rect class="box" x="30" y="100" width="150" height="70" rx="8"/><text class="t" x="60" y="140">Oluştur</text>
  <rect class="acc" x="210" y="100" width="150" height="70" rx="8"/><text class="t" x="245" y="140">Sınıflandır</text>
  <rect class="ok" x="390" y="100" width="150" height="70" rx="8"/><text class="t" x="440" y="140">Koruma</text>
  <rect class="warn" x="570" y="100" width="150" height="70" rx="8"/><text class="t" x="605" y="140">Saklama</text>
  <rect class="box" x="750" y="100" width="120" height="70" rx="8"/><text class="t" x="775" y="140">Keşif</text>
  <path class="line" d="M180 135 H210 M360 135 H390 M540 135 H570 M720 135 H750"/>
