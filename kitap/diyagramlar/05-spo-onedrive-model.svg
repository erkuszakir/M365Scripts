<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" role="img" aria-labelledby="t">
  <title id="t">SPO OneDrive model</title>
  <rect width="100%" height="100%" fill="#0f1419"/>
  <defs>
    <style>
      .t{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#e8eef5}
      .s{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#9db0c5;font-size:12px}
      .h{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#e8eef5;font-size:16px;font-weight:700}
      .box{fill:#1a2330;stroke:#3a4b5f;stroke-width:1.5}
      .acc{fill:#1e3a5f;stroke:#5b9fd4;stroke-width:1.5}
      .ok{fill:#163528;stroke:#3d9b6c;stroke-width:1.5}
      .warn{fill:#3a2e14;stroke:#c9a227;stroke-width:1.5}
      .line{stroke:#5b9fd4;stroke-width:1.5;fill:none}
      .muted{stroke:#3a4b5f;stroke-width:1.2;fill:none}
    </style>
  </defs>
  
  <text class="h" x="24" y="36">OneDrive vs SharePoint — niyet modeli</text>
  <rect class="acc" x="60" y="80" width="320" height="200" rx="10"/>
  <text class="t" x="150" y="120" font-size="16">OneDrive</text>
  <text class="s" x="90" y="155">Kullanıcıya ait “masa”</text>
  <text class="s" x="90" y="180">Taslak ve kişisel iş</text>
  <text class="s" x="90" y="205">Offboarding’de transfer</text>
  <text class="s" x="90" y="230">Aşırı paylaşım riski</text>
  <rect class="ok" x="460" y="80" width="320" height="200" rx="10"/>
  <text class="t" x="545" y="120" font-size="16">SharePoint</text>
  <text class="s" x="490" y="155">Kurumsal “dolap”</text>
  <text class="s" x="490" y="180">Kütüphane · sayfa · liste</text>
  <text class="s" x="490" y="205">Grup izinleri + hub</text>
  <text class="s" x="490" y="230">Governance şart</text>

</svg>
