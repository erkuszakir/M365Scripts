<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="t">
  <title id="t">Teams mimarisi</title>
  <rect width="100%" height="100%" fill="#0f1419"/>
  <defs>
    <style>
      .t{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#e8eef5}
      .s{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#9db0c5;font-size:12px}
      .h{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#e8eef5;font-size:16px;font-weight:700}
      .box{fill:#1a2330;stroke:#3a4b5f;stroke-width:1.5}
      .acc{fill:#1e3a5f;stroke:#5b9fd4;stroke-width:1.5}
      .ok{fill:#163528;stroke:#3d9b6c;stroke-width:1.5}
      .warn{fill:#3a2e14;stroke:#c9a227;stroke-width:1.5}
      .line{stroke:#5b9fd4;stroke-width:1.5;fill:none}
      .muted{stroke:#3a4b5f;stroke-width:1.2;fill:none}
    </style>
  </defs>
  
  <text class="h" x="24" y="36">Teams arkasındaki gerçek mimari</text>
  <rect class="acc" x="320" y="70" width="240" height="60" rx="8"/><text class="t" x="390" y="108">Microsoft Teams</text>
  <rect class="box" x="40" y="200" width="180" height="80" rx="8"/><text class="t" x="70" y="235">M365 Group</text><text class="s" x="70" y="258">üyelik · mail</text>
  <rect class="ok" x="250" y="200" width="180" height="80" rx="8"/><text class="t" x="280" y="235">SharePoint</text><text class="s" x="275" y="258">Files / kanallar</text>
  <rect class="warn" x="460" y="200" width="180" height="80" rx="8"/><text class="t" x="500" y="235">Exchange</text><text class="s" x="485" y="258">grup takvim / mailbox</text>
  <rect class="box" x="670" y="200" width="180" height="80" rx="8"/><text class="t" x="715" y="235">OneDrive</text><text class="s" x="695" y="258">1:1 sohbet dosyaları</text>
  <path class="line" d="M440 130 V190 M130 190 V200 M340 190 V200 M550 190 V200 M760 190 V200"/>
  <text class="s" x="24" y="340">Private kanal çoğu senaryoda ayrı SharePoint sitesi üretir — destek için URL’yi bilin.</text>

</svg>
